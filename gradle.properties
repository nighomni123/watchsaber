org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Gradle 9.1.0 predates JDK 25 support; the Android Studio JBR is 25.0.2, so the build JVM is
# pinned to the JBR 21 install instead. The Android *runtime* target is unaffected.
org.gradle.java.home=/Users/Mitesh Gada/Library/Java/JavaVirtualMachines/jbr-21.0.11/Contents/Home
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# The Kotlin compile daemon cannot bind a socket in this sandbox, so it silently falls back and logs
# a stack trace every build. Compile in-process instead and skip the noise.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# Versions are pinned in docs/platform-decisions.md. Change them there first.
# sdk.dir lives in local.properties (gitignored).